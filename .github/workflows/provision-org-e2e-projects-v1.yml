name: provision organization E2E repositories and projects v1

on:
  push:
    branches: [agent/provision-org-e2e-projects-v1]
    paths:
      - .github/workflows/provision-org-e2e-projects-v1.yml
      - .github/scripts/provision-org-e2e-projects-v1.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-org-e2e-projects-v1
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate workflow and provisioner syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/provision-org-e2e-projects-v1.yml
      - name: Export the fleet credential without logging it
        shell: bash
        env:
          STORED_FLEET_PAT: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STORED_FLEET_PAT"
          printf 'GH_TOKEN=%s\n' "$STORED_FLEET_PAT" >> "$GITHUB_ENV"
      - name: Provision repositories, projects, pull requests, and exact-head merges
        shell: bash
        run: bash .github/scripts/provision-org-e2e-projects-v1.sh
      - name: Publish the provisioning audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: organization-e2e-provisioning
          path: ${{ runner.temp }}/org-e2e-provision
          retention-days: 30
          if-no-files-found: warn

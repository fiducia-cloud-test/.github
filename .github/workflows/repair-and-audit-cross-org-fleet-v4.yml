name: repair and audit cross-organization test fleet v4

on:
  push:
    branches: [agent/repair-and-audit-cross-org-fleet-v4]
    paths:
      - .github/workflows/repair-and-audit-cross-org-fleet-v4.yml

permissions:
  contents: read

concurrency:
  group: repair-and-audit-cross-org-test-fleet-v4
  cancel-in-progress: false

jobs:
  repair-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Export the persisted fleet PAT without logging it
        shell: bash
        env:
          STORED_FLEET_PAT: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STORED_FLEET_PAT"
          printf 'GH_TOKEN=%s\n' "$STORED_FLEET_PAT" >> "$GITHUB_ENV"

      - name: Wait for primary quota and verify the fleet identity
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            rate_json="$(gh api rate_limit)"
            remaining="$(jq -r '.resources.core.remaining' <<< "$rate_json")"
            reset="$(jq -r '.resources.core.reset' <<< "$rate_json")"
            if (( remaining >= 250 )); then
              break
            fi
            now="$(date -u +%s)"
            delay=$((reset - now + 10))
            (( delay < 30 )) && delay=30
            echo "REST core quota is $remaining; waiting ${delay}s for reset."
            sleep "$delay"
          done

          test "$(gh api user --jq '.login')" = ORESoftware
          organizations=(
            zed-pkg-test
            3fa-app-test
            declarative-migrations-test
            cliptown-test
            claritas-viz-test
            embedded-alerts-test
            evento-globolo-test
            fiducia-cloud-test
            memebank-test
            opto-sync-test
            quaestor-ledger-test
            sonus-auris-test
            messaging-intel-test
            scintilla-run-test
            file-tunnel-test
            shared-auth-test
            hypesiege-test
            streempilot-test
          )
          for organization in "${organizations[@]}"; do
            gh api "orgs/$organization" --silent
          done

      - name: Check out and validate the repaired control plane
        shell: bash
        env:
          CONTROL_COMMIT: 0fd646e32467d14505b8d2412e1d50847fc67071
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/zed-pkg-test-fleet-control"
          git clone --quiet https://github.com/zed-pkg-test/zed-pkg-e2e.git "$control"
          git -C "$control" checkout --quiet "$CONTROL_COMMIT"
          printf 'CONTROL_ROOT=%s\n' "$control" >> "$GITHUB_ENV"

          cd "$control"
          node --check scripts/bootstrap-test-org-fleet-worktree-safe.mjs
          node --check scripts/list-test-org-fleet-repositories.mjs
          node scripts/validate-test-org-fleet.mjs
          node --test \
            tests/test-org-fleet.test.mjs \
            tests/bootstrap-retry-policy.test.mjs \
            tests/paced-fleet-executor.test.mjs \
            tests/idempotent-fleet-pr-repair.test.mjs

      - name: Repair every expected generated repository and pull request
        shell: bash
        env:
          TEST_ORG_FLEET_SKIP_TOPICS: "true"
        run: |
          set -euo pipefail
          cd "$CONTROL_ROOT"

          failures=()
          processed=0
          observed_writes=0

          wait_for_quota() {
            local minimum="${1:-200}"
            while true; do
              local rate_json remaining reset now delay
              if ! rate_json="$(gh api rate_limit 2>/dev/null)"; then
                sleep 60
                continue
              fi
              remaining="$(jq -r '.resources.core.remaining' <<< "$rate_json")"
              reset="$(jq -r '.resources.core.reset' <<< "$rate_json")"
              if (( remaining >= minimum )); then
                return 0
              fi
              now="$(date -u +%s)"
              delay=$((reset - now + 10))
              (( delay < 30 )) && delay=30
              echo "REST core quota is $remaining; waiting ${delay}s for reset."
              sleep "$delay"
            done
          }

          apply_one() {
            local organization="$1"
            local repository="$2"
            local label="$organization/$repository"
            local safe_repository="${repository//[^a-zA-Z0-9_.-]/_}"
            local summary_file="$RUNNER_TEMP/repair-${organization}-${safe_repository}.json"
            local stderr_file="$RUNNER_TEMP/repair-${organization}-${safe_repository}.stderr"

            for attempt in 1 2 3 4 5; do
              rm -f "$summary_file" "$stderr_file"
              echo "Repairing $label (attempt $attempt of 5)"
              if node scripts/bootstrap-test-org-fleet-worktree-safe.mjs \
                  --apply \
                  --org "$organization" \
                  --repo "$repository" \
                  --concurrency 1 \
                  --summary-json > "$summary_file" 2> "$stderr_file"; then
                local writes
                writes="$(jq '(.created // 0) + (.committed // 0) + (.pullRequests // 0)' "$summary_file")"
                observed_writes=$((observed_writes + writes))
                if (( writes > 0 )); then
                  sleep 20
                else
                  sleep 2
                fi
                return 0
              fi

              cat "$stderr_file" >&2 || true
              if (( attempt < 5 )); then
                wait_for_quota 100
                sleep $((attempt * 90))
              fi
            done

            failures+=("$label")
            return 1
          }

          known_repairs=(
            declarative-migrations-test/postgres-concurrent-locks-e2e
            declarative-migrations-test/postgres-dirty-schema-e2e
            declarative-migrations-test/cockroach-rollback-e2e
            declarative-migrations-test/cockroach-failure-injection-e2e
            declarative-migrations-test/cockroach-concurrent-ddl-e2e
            declarative-migrations-test/cross-engine-drift-e2e
            declarative-migrations-test/migration-safety-lint-e2e
            embedded-alerts-test/sdk-git-submodule-e2e
            embedded-alerts-test/sdk-zed-dependency-e2e
            embedded-alerts-test/clients-package-e2e
            embedded-alerts-test/api-contract-e2e
            embedded-alerts-test/websocket-events-e2e
            embedded-alerts-test/tenant-isolation-e2e
            embedded-alerts-test/delivery-retry-e2e
            embedded-alerts-test/sts-credential-rotation-e2e
            evento-globolo-test/axum-api-e2e
            evento-globolo-test/sdk-git-submodule-e2e
            evento-globolo-test/sdk-zed-dependency-e2e
            evento-globolo-test/clients-native-package-e2e
            evento-globolo-test/websocket-broadcast-e2e
            evento-globolo-test/auth-rbac-e2e
            evento-globolo-test/rate-limit-e2e
            evento-globolo-test/schema-migrations-e2e
            evento-globolo-test/nats-reconnect-e2e
            evento-globolo-test/process-supervision-e2e
            evento-globolo-test/cron-e2e
            evento-globolo-test/tls-termination-e2e
            evento-globolo-test/observability-e2e
            evento-globolo-test/performance-e2e
          )

          echo "Repairing the 29 exact gaps from the partial live audit."
          for item in "${known_repairs[@]}"; do
            organization="${item%%/*}"
            repository="${item#*/}"
            apply_one "$organization" "$repository" || true
          done

          organizations=(
            zed-pkg-test
            3fa-app-test
            declarative-migrations-test
            cliptown-test
            claritas-viz-test
            embedded-alerts-test
            evento-globolo-test
            fiducia-cloud-test
            memebank-test
            opto-sync-test
            quaestor-ledger-test
            sonus-auris-test
            messaging-intel-test
            scintilla-run-test
            file-tunnel-test
            shared-auth-test
            hypesiege-test
            streempilot-test
          )

          {
            echo '## Idempotent generated-fleet repair'
            echo
            echo '| Organization | Specialized repositories reconciled | Visible repositories |'
            echo '|---|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"

          for organization in "${organizations[@]}"; do
            wait_for_quota 250
            mapfile -t repositories < <(node scripts/list-test-org-fleet-repositories.mjs --org "$organization")
            for repository in "${repositories[@]}"; do
              processed=$((processed + 1))
              echo "[$processed/301] $organization/$repository"
              apply_one "$organization" "$repository" || true
            done
            visible="$(gh api --paginate "orgs/$organization/repos?type=all&per_page=100" --jq '.[].name' | wc -l | tr -d '[:space:]')"
            printf '| `%s` | %s | %s |\n' "$organization" "${#repositories[@]}" "$visible" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "Specialized repositories reconciled: $processed"
            echo
            echo "Observed create/commit/PR operations: $observed_writes"
            echo
            echo "Outer repair failures: ${#failures[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failures[@]} > 0 )); then
            printf 'Repair attempts still failed for: %s\n' "${failures[*]}" | tee "$RUNNER_TEMP/fleet-repair-failures.txt" >&2
          else
            : > "$RUNNER_TEMP/fleet-repair-failures.txt"
          fi

      - name: Run the exact 341 repository and 319 PR audit
        shell: bash
        env:
          AUDIT_COMMIT: b6037412b1ae90d7df37f69f83d6c61af2083109
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/zed-pkg-test-fleet-audit"
          git clone --quiet https://github.com/zed-pkg-test/zed-pkg-e2e.git "$audit"
          git -C "$audit" checkout --quiet "$AUDIT_COMMIT"
          cd "$audit"

          node --test tests/audit-test-org-fleet.test.mjs

          set +e
          node scripts/audit-test-org-fleet-live.mjs \
            --output "$RUNNER_TEMP/test-org-fleet-live-audit.json" \
            --markdown "$RUNNER_TEMP/test-org-fleet-live-audit.md"
          status=$?
          set -e

          cat "$RUNNER_TEMP/test-org-fleet-live-audit.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'AUDIT_JSON_SUMMARY'
          jq -c '.summary' "$RUNNER_TEMP/test-org-fleet-live-audit.json"
          echo 'AUDIT_ORGANIZATION_ERRORS'
          jq -c '.organizations[] | select(.errors | length > 0) | {testOrg, expectedRepositories, visibleRepositories, verifiedGenerated, expectedGenerated, openGeneratedPullRequests, errors}' \
            "$RUNNER_TEMP/test-org-fleet-live-audit.json"
          exit "$status"

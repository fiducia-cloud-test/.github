name: lint organization E2E provisioner

on:
  push:
    branches: [agent/provision-org-e2e-projects-v1]
    paths:
      - .github/workflows/provision-org-e2e-projects-v1.yml
      - .github/workflows/lint-provisioner.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-org-e2e-provisioner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate provisioning workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/provision-org-e2e-projects-v1.yml

name: sync organization E2E and CI fleet

on:
  push:
    branches:
      - main
      - agent/provision-org-e2e-projects-v1
    paths:
      - .github/scripts/sync-org-e2e-fleet.sh
      - .github/workflows/sync-org-e2e-fleet.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-org-e2e-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate workflow and script syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/sync-org-e2e-fleet.yml
      - name: Export the fleet credential without logging it
        shell: bash
        env:
          STORED_FLEET_PAT: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STORED_FLEET_PAT"
          printf 'GH_TOKEN=%s\n' "$STORED_FLEET_PAT" >> "$GITHUB_ENV"
      - name: Sync organization projects and audit delivered E2E coverage
        shell: bash
        run: bash .github/scripts/sync-org-e2e-fleet.sh
      - name: Publish organization E2E fleet audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: organization-e2e-fleet-audit
          path: ${{ runner.temp }}/organization-e2e-fleet
          retention-days: 30
          if-no-files-found: error
